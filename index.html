<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallax — Time Convergence</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04080f;--bg2:#08101c;--surface:#0c1829;--surface2:#112240;--surface3:#162d50;
  --border:#1a3355;--border-glow:#1e4976;
  --text:#cdd9e5;--text-bright:#e8f0f8;--text-dim:#6b8aad;--text-muted:#3d5a80;
  --cyan:#00e5ff;--cyan-dim:rgba(0,229,255,0.12);--cyan-glow:rgba(0,229,255,0.25);
  --amber:#ffab40;--amber-dim:rgba(255,171,64,0.12);
  --business:rgba(0,229,255,0.10);--offhours:rgba(255,255,255,0.015);
  --danger:#ff5252;--success:#69f0ae;--radius:8px;
  --glow-sm:0 0 12px rgba(0,229,255,0.15);--glow-md:0 0 24px rgba(0,229,255,0.1);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 20% 0%,rgba(0,229,255,0.04) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(0,188,212,0.03) 0%,transparent 60%);pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.02) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0;}
.app{position:relative;z-index:1;}
.header{padding:24px 36px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);backdrop-filter:blur(12px);background:rgba(4,8,15,0.8);position:sticky;top:0;z-index:50;}
.logo{display:flex;align-items:center;gap:14px;}
.logo-mark{width:36px;height:36px;position:relative;display:flex;align-items:center;justify-content:center;}
.logo-mark::before{content:'';position:absolute;width:36px;height:36px;border:2px solid var(--cyan);border-radius:50%;opacity:0.6;animation:pulse-ring 3s ease-in-out infinite;}
.logo-mark::after{content:'';width:8px;height:8px;background:var(--cyan);border-radius:50%;box-shadow:0 0 12px var(--cyan),0 0 24px rgba(0,229,255,0.3);}
@keyframes pulse-ring{0%,100%{transform:scale(1);opacity:0.6;}50%{transform:scale(1.15);opacity:0.3;}}
.logo h1{font-size:22px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-bright);}
.logo h1 span{color:var(--cyan);}
.logo-sub{font-size:11px;font-weight:400;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-top:2px;}
.header-actions{display:flex;gap:8px;}
.btn{padding:8px 18px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;letter-spacing:0.5px;}
.btn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:var(--glow-sm);}
.btn-glow{background:linear-gradient(135deg,rgba(0,229,255,0.15),rgba(0,188,212,0.1));border-color:var(--cyan);color:var(--cyan);text-shadow:0 0 8px rgba(0,229,255,0.3);}
.btn-glow:hover{background:linear-gradient(135deg,rgba(0,229,255,0.25),rgba(0,188,212,0.2));box-shadow:var(--glow-md);}
.toolbar{padding:16px 36px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:rgba(8,16,28,0.6);backdrop-filter:blur(8px);}
.search-wrap{position:relative;flex:1;max-width:380px;}
.search-wrap input[type="text"]{width:100%;padding:10px 14px 10px 38px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-bright);font-family:'Outfit',sans-serif;font-size:13px;outline:none;transition:all 0.2s;}
.search-wrap input:focus{border-color:var(--cyan);box-shadow:var(--glow-sm);}
.search-wrap input::placeholder{color:var(--text-muted);}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:15px;pointer-events:none;}
.search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface2);border:1px solid var(--border-glow);border-radius:8px;max-height:280px;overflow-y:auto;z-index:100;display:none;box-shadow:0 8px 32px rgba(0,0,0,0.4),var(--glow-sm);}
.search-results.show{display:block;}
.search-result-item{padding:10px 14px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;transition:all 0.1s;border-bottom:1px solid rgba(26,51,85,0.5);}
.search-result-item:last-child{border-bottom:none;}
.search-result-item:hover{background:var(--cyan-dim);color:var(--cyan);}
.search-result-item .tz-name{font-weight:500;}
.search-result-item .tz-offset{color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:11px;}
.toolbar-right{display:flex;align-items:center;gap:14px;margin-left:auto;}
.time-slider-wrap{display:flex;align-items:center;gap:10px;}
.time-slider-label{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--cyan);min-width:80px;text-align:center;font-weight:500;text-shadow:0 0 8px rgba(0,229,255,0.3);}
input[type="range"]{-webkit-appearance:none;width:180px;height:3px;background:var(--border);border-radius:2px;outline:none;}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--cyan);cursor:pointer;border:2px solid var(--bg);box-shadow:0 0 8px var(--cyan);}
.slider-hint{font-size:11px;color:var(--text-muted);}
.main{padding:24px 36px 40px;}
.zones-container{display:flex;flex-direction:column;gap:3px;}
.zone-row{display:grid;grid-template-columns:220px 1fr 32px;align-items:stretch;background:var(--surface);border-radius:var(--radius);overflow:hidden;transition:all 0.15s;border:1px solid transparent;}
.zone-row:hover{border-color:var(--border);background:var(--surface2);}
.zone-info{padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-right:1px solid var(--border);}
.zone-city{font-weight:600;font-size:13px;letter-spacing:0.3px;color:var(--text-bright);}
.zone-meta{font-size:10px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;display:flex;gap:6px;align-items:center;}
.zone-time{color:var(--cyan);font-weight:500;text-shadow:0 0 6px rgba(0,229,255,0.2);}
.zone-strip-wrap{position:relative;overflow:hidden;}
.zone-strip{display:grid;grid-template-columns:repeat(48,1fr);gap:0px;padding:6px 4px;}
.half-block{height:32px;position:relative;transition:all 0.1s;cursor:default;display:flex;align-items:flex-end;justify-content:center;}
.half-block.on-hour{border-left:1px solid rgba(26,51,85,0.4);}
.half-block .hour-label{font-family:'JetBrains Mono',monospace;font-size:7px;color:var(--text-muted);opacity:0.6;padding-bottom:1px;}
.half-block:hover .hour-label{opacity:1;color:var(--text-bright);}
.half-block.active-hr{background:var(--business);border-top:1px solid rgba(0,229,255,0.12);border-bottom:1px solid rgba(0,229,255,0.08);}
.half-block.offhours{background:var(--offhours);}
.half-block.overlap{
  background:rgba(0,229,255,0.22);
  border-top:2px solid var(--cyan);
  border-bottom:2px solid var(--cyan);
  box-shadow:inset 0 0 20px rgba(0,229,255,0.15),0 0 12px rgba(0,229,255,0.1);
}
.half-block.overlap.on-hour{border-left:1px solid rgba(0,229,255,0.4);}
.half-block.overlap .hour-label{color:var(--cyan);opacity:1;font-weight:600;}
.half-block.overlap-start{border-left:2px solid var(--cyan);border-top-left-radius:4px;border-bottom-left-radius:4px;}
.half-block.overlap-end{border-right:2px solid var(--cyan);border-top-right-radius:4px;border-bottom-right-radius:4px;}
.time-indicator{position:absolute;top:0;bottom:0;width:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan),0 0 16px rgba(0,229,255,0.3);border-radius:1px;z-index:10;pointer-events:none;}
.time-indicator::before{content:'';position:absolute;top:0;left:-3px;width:8px;height:8px;background:var(--cyan);border-radius:50%;box-shadow:0 0 6px var(--cyan);}
.zone-remove{display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);transition:all 0.15s;font-size:14px;}
.zone-remove:hover{color:var(--danger);}
.hour-header-row{display:grid;grid-template-columns:220px 1fr 32px;margin-bottom:4px;}
.hour-headers{display:grid;grid-template-columns:repeat(48,1fr);gap:0px;padding:0 4px;}
.hour-header{text-align:left;font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--text-muted);padding:1px 0;}
.panel{margin-top:20px;padding:18px 22px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);}
.panel-title{font-weight:600;font-size:12px;margin-bottom:12px;display:flex;align-items:center;gap:8px;letter-spacing:0.5px;text-transform:uppercase;color:var(--text-dim);}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.dot-cyan{background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
.dot-amber{background:var(--amber);box-shadow:0 0 8px var(--amber);}
.overlap-windows{display:flex;flex-wrap:wrap;gap:8px;}
.overlap-window{padding:8px 14px;background:linear-gradient(135deg,rgba(0,229,255,0.12),rgba(0,188,212,0.06));border:1px solid rgba(0,229,255,0.3);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan);font-weight:500;text-shadow:0 0 6px rgba(0,229,255,0.3);}
.overlap-detail{margin-top:10px;font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;line-height:1.8;}
.no-overlap{color:var(--text-muted);font-size:12px;}
.hours-editor{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.hours-zone-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:12px;}
.hours-zone-chip label{color:var(--text-dim);font-weight:500;min-width:70px;}
.hours-zone-chip input[type="time"]{padding:3px 6px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--cyan);font-family:'JetBrains Mono',monospace;font-size:11px;outline:none;}
.hours-zone-chip input[type="time"]:focus{border-color:var(--cyan);}
.hours-zone-chip span{color:var(--text-muted);font-size:10px;}
.chip-toggle{padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font-size:10px;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.15s;}
.chip-toggle:hover{border-color:var(--cyan);color:var(--cyan);}
.chip-toggle.on{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
.modal-overlay{position:fixed;inset:0;background:rgba(4,8,15,0.8);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px);}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface2);border:1px solid var(--border-glow);border-radius:12px;padding:28px;width:500px;max-width:92vw;box-shadow:0 16px 64px rgba(0,0,0,0.5),var(--glow-md);}
.modal h2{font-size:18px;font-weight:700;margin-bottom:6px;color:var(--text-bright);}
.modal p{font-size:13px;color:var(--text-dim);margin-bottom:16px;}
.share-url{width:100%;padding:10px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--cyan);font-family:'JetBrains Mono',monospace;font-size:11px;outline:none;margin-bottom:14px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--cyan);color:var(--bg);padding:10px 24px;border-radius:6px;font-size:13px;font-weight:600;opacity:0;transition:all 0.3s;z-index:300;box-shadow:0 0 24px rgba(0,229,255,0.3);}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.empty-state{text-align:center;padding:80px 20px;}
.empty-state h3{font-size:16px;font-weight:600;color:var(--text-dim);margin-bottom:8px;letter-spacing:1px;text-transform:uppercase;}
.empty-state p{font-size:13px;color:var(--text-muted);}
.legend{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-dim);}
.legend-swatch{width:12px;height:12px;border-radius:2px;}
.kbd-hints{position:fixed;bottom:16px;right:24px;display:flex;gap:12px;z-index:10;}
.kbd{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);display:flex;align-items:center;gap:4px;}
.kbd code{background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:2px 6px;font-size:10px;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
@media(max-width:768px){.header,.toolbar,.main{padding-left:16px;padding-right:16px;}.zone-row,.hour-header-row{grid-template-columns:140px 1fr 28px;}.logo-sub{display:none;}input[type="range"]{width:120px;}.kbd-hints{display:none;}}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <div class="logo"><div class="logo-mark"></div><div><h1>P<span>A</span>RALLAX</h1><div class="logo-sub">time convergence</div></div></div>
  <div class="header-actions">
    <button class="btn" onclick="resetToNow()">⟳ Now</button>
    <button class="btn btn-glow" onclick="openShareModal()">Share ↗</button>
  </div>
</div>
<div class="toolbar">
  <div class="search-wrap"><span class="search-icon">⌕</span><input type="text" id="searchInput" placeholder="Add timezone — city or zone…" autocomplete="off"><div class="search-results" id="searchResults"></div></div>
  <div class="toolbar-right"><div class="slider-hint">Peek</div><div class="time-slider-wrap"><input type="range" id="timeSlider" min="-1440" max="1440" value="0"><span class="time-slider-label" id="sliderLabel">NOW</span></div></div>
</div>
<div class="main">
  <div class="hour-header-row" id="hourHeaderRow" style="display:none;"><div></div><div class="hour-headers" id="hourHeaders"></div><div></div></div>
  <div class="zones-container" id="zonesContainer"></div>
  <div class="panel" id="hoursPanel" style="display:none;">
    <div class="panel-title"><span class="dot dot-amber"></span>Active Hours <span style="font-weight:400;font-size:10px;text-transform:none;color:var(--text-muted);margin-left:6px;">Default 09:00–18:30 · click to customise</span></div>
    <div class="hours-editor" id="hoursEditor"></div>
  </div>
  <div class="panel" id="overlapPanel" style="display:none;">
    <div class="panel-title"><span class="dot dot-cyan"></span>Overlap Windows</div>
    <div class="overlap-windows" id="overlapWindows"></div>
    <div class="overlap-detail" id="overlapDetail"></div>
  </div>
  <div class="legend" id="legend" style="display:none;">
    <div class="legend-item"><div class="legend-swatch" style="background:var(--business);border:1px solid rgba(0,229,255,0.06);"></div>Active</div>
    <div class="legend-item"><div class="legend-swatch" style="background:rgba(0,229,255,0.22);border:2px solid var(--cyan);box-shadow:0 0 6px rgba(0,229,255,0.15);"></div>Overlap</div>
  </div>
</div>
<div class="modal-overlay" id="shareModal"><div class="modal"><h2>Share</h2><p>Shares timezone list. Hours stay private.</p><input type="text" class="share-url" id="shareUrl" readonly><div class="modal-actions"><button class="btn" onclick="closeShareModal()">Close</button><button class="btn btn-glow" onclick="copyShareLink()">Copy</button></div></div></div>
<div class="toast" id="toast"></div>
<div class="kbd-hints"><div class="kbd"><code>/</code> Search</div><div class="kbd"><code>←→</code> Scrub</div></div>
</div>
<script>
const SLOTS=48,DEFAULT_START=9,DEFAULT_END=18.5,STORAGE_KEY='parallax_state',STORAGE_VERSION=5;
function buildTzDb(){
  const c={'Asia/Hong_Kong':'Hong Kong','Asia/Singapore':'Singapore','America/New_York':'New York','Europe/London':'London','Asia/Tokyo':'Tokyo','Asia/Shanghai':'Shanghai','Australia/Sydney':'Sydney','Asia/Dubai':'Dubai','Asia/Kolkata':'Mumbai','America/Los_Angeles':'Los Angeles','America/Chicago':'Chicago','America/Denver':'Denver','America/Toronto':'Toronto','America/Vancouver':'Vancouver','America/Sao_Paulo':'São Paulo','America/Argentina/Buenos_Aires':'Buenos Aires','America/Mexico_City':'Mexico City','Europe/Paris':'Paris','Europe/Berlin':'Berlin','Europe/Amsterdam':'Amsterdam','Europe/Zurich':'Zurich','Europe/Madrid':'Madrid','Europe/Rome':'Rome','Europe/Stockholm':'Stockholm','Europe/Moscow':'Moscow','Europe/Istanbul':'Istanbul','Africa/Cairo':'Cairo','Africa/Lagos':'Lagos','Africa/Nairobi':'Nairobi','Africa/Johannesburg':'Johannesburg','Asia/Seoul':'Seoul','Asia/Taipei':'Taipei','Asia/Bangkok':'Bangkok','Asia/Jakarta':'Jakarta','Asia/Kuala_Lumpur':'Kuala Lumpur','Asia/Manila':'Manila','Asia/Riyadh':'Riyadh','Asia/Jerusalem':'Tel Aviv','Pacific/Auckland':'Auckland','Pacific/Honolulu':'Honolulu','America/Anchorage':'Anchorage','America/Lima':'Lima','America/Bogota':'Bogota','Europe/Lisbon':'Lisbon','Europe/Dublin':'Dublin','Europe/Helsinki':'Helsinki','Europe/Warsaw':'Warsaw','Europe/Prague':'Prague','Europe/Vienna':'Vienna','Asia/Qatar':'Doha','Asia/Ho_Chi_Minh':'Ho Chi Minh City','Asia/Colombo':'Colombo','Australia/Perth':'Perth','Australia/Melbourne':'Melbourne','Asia/Karachi':'Karachi','Asia/Dhaka':'Dhaka','Asia/Kathmandu':'Kathmandu','America/Phoenix':'Phoenix','Europe/Bucharest':'Bucharest','Europe/Athens':'Athens','Europe/Brussels':'Brussels','Europe/Copenhagen':'Copenhagen','Europe/Oslo':'Oslo','Asia/Almaty':'Almaty','Pacific/Fiji':'Fiji'};
  const db=[];for(const[tz,city]of Object.entries(c))db.push({city,tz,region:tz.split('/')[0]});
  try{for(const tz of Intl.supportedValuesOf('timeZone')){if(c[tz])continue;const p=tz.split('/');db.push({city:p[p.length-1].replace(/_/g,' '),tz,region:p[0]});}}catch(e){}
  return db;
}
const TZ_DB=buildTzDb();
let zones=[],sliderOffset=0,customHours={},lastMatches=[];
function getOffsetStr(tz){try{const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'shortOffset'}).formatToParts(new Date());return(p.find(x=>x.type==='timeZoneName')||{}).value||'';}catch{return'';}}
function getTimeInZone(tz,d){return new Date(d.toLocaleString('en-US',{timeZone:tz}));}
function fmtTime(tz,d){return new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(d);}
function fmtDate(tz,d){return new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short',month:'short',day:'numeric'}).format(d);}
function getCurrentTime(){return new Date(Date.now()+sliderOffset*60000);}
function slotToHour(s){return s/2;}
function getActiveHours(tz){const c=customHours[tz];if(c&&c.enabled)return{start:c.start,end:c.end};return{start:DEFAULT_START,end:DEFAULT_END};}
function isSlotActive(sh,start,end){if(start<end)return sh>=start&&sh<end;if(start===end)return true;return sh>=start||sh<end;}
function decToTimeStr(d){const h=Math.floor(d);const m=Math.round((d-h)*60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}
function timeStrToDec(s){const[h,m]=s.split(':').map(Number);return h+m/60;}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({v:STORAGE_VERSION,zones,customHours}));}catch(e){}}
function loadState(){try{const r=localStorage.getItem(STORAGE_KEY);if(!r)return false;const s=JSON.parse(r);if(s.v!==STORAGE_VERSION){localStorage.removeItem(STORAGE_KEY);return false;}if(s.zones&&s.zones.length){zones=s.zones;customHours=s.customHours||{};zones.forEach(z=>{if(!customHours[z.tz])customHours[z.tz]={start:DEFAULT_START,end:DEFAULT_END,enabled:false};});return true;}}catch(e){}return false;}
function buildShareURL(){return location.origin+location.pathname+'?z='+zones.map(z=>encodeURIComponent(z.city)+'|'+encodeURIComponent(z.tz)).join(',');}
function loadFromURL(){const p=new URLSearchParams(location.search);const zP=p.get('z');if(!zP)return false;zones=zP.split(',').map(s=>{const[city,tz]=s.split('|').map(decodeURIComponent);return{city,tz,region:tz?tz.split('/')[0]:''};}).filter(z=>z.city&&z.tz);zones.forEach(z=>{if(!customHours[z.tz])customHours[z.tz]={start:DEFAULT_START,end:DEFAULT_END,enabled:false};});return zones.length>0;}

const searchInput=document.getElementById('searchInput'),searchResults=document.getElementById('searchResults');
searchInput.addEventListener('input',()=>{const q=searchInput.value.trim().toLowerCase();if(q.length<1){searchResults.classList.remove('show');return;}const matches=TZ_DB.filter(t=>t.city.toLowerCase().includes(q)||t.tz.toLowerCase().includes(q)||t.region.toLowerCase().includes(q)).filter(t=>!zones.find(z=>z.tz===t.tz&&z.city===t.city)).slice(0,10);if(!matches.length){searchResults.innerHTML='<div style="padding:12px;color:var(--text-muted);font-size:12px;">No match</div>';searchResults.classList.add('show');return;}searchResults.innerHTML=matches.map((m,i)=>`<div class="search-result-item" data-idx="${i}"><span class="tz-name">${m.city}</span><span class="tz-offset">${m.tz} · ${getOffsetStr(m.tz)}</span></div>`).join('');lastMatches=matches;searchResults.classList.add('show');});
searchResults.addEventListener('click',e=>{const item=e.target.closest('.search-result-item');if(item){const m=lastMatches[parseInt(item.dataset.idx)];if(m)addZone(m.city,m.tz,m.region);}});
searchInput.addEventListener('keydown',e=>{if(e.key==='Escape'){searchResults.classList.remove('show');searchInput.blur();}});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))searchResults.classList.remove('show');});

function addZone(city,tz,region){if(zones.find(z=>z.tz===tz&&z.city===city))return;zones.push({city,tz,region:region||tz.split('/')[0]});if(!customHours[tz])customHours[tz]={start:DEFAULT_START,end:DEFAULT_END,enabled:false};searchInput.value='';searchResults.classList.remove('show');saveState();render();}
function removeZone(idx){delete customHours[zones[idx].tz];zones.splice(idx,1);saveState();render();}

const timeSlider=document.getElementById('timeSlider'),sliderLabel=document.getElementById('sliderLabel');
timeSlider.addEventListener('input',()=>{sliderOffset=parseInt(timeSlider.value);updateSliderLabel();render();});
function updateSliderLabel(){if(sliderOffset===0){sliderLabel.textContent='NOW';return;}const sign=sliderOffset>0?'+':'−';const abs=Math.abs(sliderOffset);const h=Math.floor(abs/60),m=abs%60;sliderLabel.textContent=`${sign}${h}h${m>0?' '+m+'m':''}`;}
function resetToNow(){sliderOffset=0;timeSlider.value=0;sliderLabel.textContent='NOW';render();}
function toggleCustomHours(tz){if(!customHours[tz])customHours[tz]={start:DEFAULT_START,end:DEFAULT_END,enabled:false};customHours[tz].enabled=!customHours[tz].enabled;saveState();render();}
function updateCustomStart(tz,val){if(!customHours[tz])customHours[tz]={start:DEFAULT_START,end:DEFAULT_END,enabled:true};customHours[tz].start=timeStrToDec(val);customHours[tz].enabled=true;saveState();render();}
function updateCustomEnd(tz,val){if(!customHours[tz])customHours[tz]={start:DEFAULT_START,end:DEFAULT_END,enabled:true};customHours[tz].end=timeStrToDec(val);customHours[tz].enabled=true;saveState();render();}

function render(){
  const container=document.getElementById('zonesContainer'),headerRow=document.getElementById('hourHeaderRow'),overlapPanel=document.getElementById('overlapPanel'),hoursPanel=document.getElementById('hoursPanel'),legend=document.getElementById('legend');
  const viewTime=getCurrentTime();
  if(!zones.length){container.innerHTML='<div class="empty-state"><h3>Add a timezone</h3><p>Press <code style="background:var(--surface2);padding:2px 6px;border-radius:3px;font-size:12px;border:1px solid var(--border);">/</code> or search above</p></div>';headerRow.style.display='none';overlapPanel.style.display='none';hoursPanel.style.display='none';legend.style.display='none';return;}
  headerRow.style.display='grid';legend.style.display='flex';
  document.getElementById('hourHeaders').innerHTML=Array.from({length:SLOTS},(_,s)=>s%2===0?`<div class="hour-header">${String(s/2).padStart(2,'0')}</div>`:'<div class="hour-header"></div>').join('');

  const overlapSet=new Set(findOverlapSlots(viewTime));

  container.innerHTML=zones.map((zone,idx)=>{
    const localTime=fmtTime(zone.tz,viewTime),offset=getOffsetStr(zone.tz),localDate=fmtDate(zone.tz,viewTime),active=getActiveHours(zone.tz);
    const localNow=getTimeInZone(zone.tz,viewTime);
    const indicatorPct=((localNow.getHours()+localNow.getMinutes()/60)/24)*100;
    const blocks=Array.from({length:SLOTS},(_,slot)=>{
      const sh=slotToHour(slot),onHour=slot%2===0;
      const ia=isSlotActive(sh,active.start,active.end);
      const io=overlapSet.has(slot)&&zones.length>1;
      let cls=ia?'active-hr':'offhours';
      if(io)cls='overlap';
      if(onHour)cls+=' on-hour';
      if(io&&!overlapSet.has(slot-1))cls+=' overlap-start';
      if(io&&!overlapSet.has(slot+1))cls+=' overlap-end';
      const label=onHour?`<span class="hour-label">${String(Math.floor(sh)).padStart(2,'0')}</span>`:'';
      return `<div class="half-block ${cls}" title="${decToTimeStr(sh)} ${zone.city}">${label}</div>`;
    }).join('');
    return `<div class="zone-row"><div class="zone-info"><div class="zone-city">${zone.city}</div><div class="zone-meta"><span class="zone-time">${localTime}</span><span>${offset}</span><span>${localDate}</span></div></div><div class="zone-strip-wrap"><div class="time-indicator" style="left:calc(4px + (100% - 8px) * ${indicatorPct/100})"></div><div class="zone-strip">${blocks}</div></div><div class="zone-remove" onclick="removeZone(${idx})" title="Remove">×</div></div>`;
  }).join('');

  hoursPanel.style.display='';
  document.getElementById('hoursEditor').innerHTML=zones.map(z=>{
    const c=customHours[z.tz]||{start:DEFAULT_START,end:DEFAULT_END,enabled:false};
    return `<div class="hours-zone-chip"><label>${z.city}</label><button class="chip-toggle ${c.enabled?'on':''}" onclick="toggleCustomHours('${z.tz}')">${c.enabled?'Custom':'9–18:30'}</button>${c.enabled?`<input type="time" value="${decToTimeStr(c.start)}" step="1800" onchange="updateCustomStart('${z.tz}',this.value)"><span>to</span><input type="time" value="${decToTimeStr(c.end)}" step="1800" onchange="updateCustomEnd('${z.tz}',this.value)">`:''}</div>`;
  }).join('');

  if(zones.length>1){
    overlapPanel.style.display='';
    const wEl=document.getElementById('overlapWindows'),dEl=document.getElementById('overlapDetail');
    const overlapSlots=[...overlapSet].sort((a,b)=>a-b);
    if(!overlapSlots.length){wEl.innerHTML='<div class="no-overlap">No overlapping active hours.</div>';dEl.innerHTML='';}
    else{
      const ranges=groupConsecutive(overlapSlots);
      const refLocal=getTimeInZone(zones[0].tz,viewTime);
      const refFrac=refLocal.getHours()+refLocal.getMinutes()/60;
      wEl.innerHTML=ranges.map(r=>{const sh=slotToHour(r[0]),eh=slotToHour(r[r.length-1])+0.5;return `<div class="overlap-window">${decToTimeStr(sh)}–${decToTimeStr(eh%24)} ${zones[0].city}</div>`;}).join('');
      dEl.innerHTML=ranges.map(r=>{const sh=slotToHour(r[0]),eh=slotToHour(r[r.length-1])+0.5;const sU=new Date(viewTime.getTime()+(sh-refFrac)*3600000);const eU=new Date(viewTime.getTime()+(eh-refFrac)*3600000);return zones.map(z=>`${z.city} ${fmtTime(z.tz,sU)}–${fmtTime(z.tz,eU)}`).join(' · ');}).join('<br>');
    }
  }else overlapPanel.style.display='none';
}

function findOverlapSlots(viewTime){
  if(zones.length<2)return[];
  const result=[],refLocal=getTimeInZone(zones[0].tz,viewTime),refFrac=refLocal.getHours()+refLocal.getMinutes()/60;
  for(let slot=0;slot<SLOTS;slot++){
    const sh=slotToHour(slot),testUTC=new Date(viewTime.getTime()+(sh-refFrac)*3600000);
    let all=true;
    for(const z of zones){const lc=getTimeInZone(z.tz,testUTC);const lcH=lc.getHours()+lc.getMinutes()/60;if(!isSlotActive(lcH,getActiveHours(z.tz).start,getActiveHours(z.tz).end)){all=false;break;}}
    if(all)result.push(slot);
  }
  return result;
}
function groupConsecutive(arr){if(!arr.length)return[];const s=[...arr].sort((a,b)=>a-b);const g=[[s[0]]];for(let i=1;i<s.length;i++){if(s[i]===s[i-1]+1)g[g.length-1].push(s[i]);else g.push([s[i]]);}return g;}

function openShareModal(){document.getElementById('shareUrl').value=buildShareURL();document.getElementById('shareModal').classList.add('show');}
function closeShareModal(){document.getElementById('shareModal').classList.remove('show');}
function copyShareLink(){navigator.clipboard.writeText(document.getElementById('shareUrl').value).then(()=>{showToast('Link copied ✓');closeShareModal();});}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
document.getElementById('shareModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeShareModal();});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='/'){e.preventDefault();searchInput.focus();}if(e.key==='ArrowRight'){sliderOffset=Math.min(1440,sliderOffset+30);timeSlider.value=sliderOffset;updateSliderLabel();render();}if(e.key==='ArrowLeft'){sliderOffset=Math.max(-1440,sliderOffset-30);timeSlider.value=sliderOffset;updateSliderLabel();render();}if(e.key==='Escape'){searchInput.blur();searchResults.classList.remove('show');}});

const loadedFromURL=loadFromURL();
if(!loadedFromURL){if(!loadState()){zones=[{city:'Hong Kong',tz:'Asia/Hong_Kong',region:'Asia'},{city:'Singapore',tz:'Asia/Singapore',region:'Asia'},{city:'New York',tz:'America/New_York',region:'America'},{city:'London',tz:'Europe/London',region:'Europe'}];zones.forEach(z=>{customHours[z.tz]={start:DEFAULT_START,end:DEFAULT_END,enabled:false};});saveState();}}
if(loadedFromURL)saveState();
render();
setInterval(()=>{if(sliderOffset===0)render();},60000);
</script>
</body>
